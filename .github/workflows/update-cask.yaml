name: Update Homebrew Cask Package

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 5"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Update Cask
        run: |
          python scripts/update-*.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .

          git diff --cached --quiet || \
          git commit -m "cask: update"

      - name: Push
        run: git push