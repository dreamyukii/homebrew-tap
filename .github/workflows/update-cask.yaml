name: Update Homebrew Cask Package

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 5"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Show Repository Structure
        run: |
          echo "=========================================="
          echo "Repository Structure"
          echo "=========================================="

          pwd
          echo

          ls -lah
          echo

          find .github/workflows/scripts -maxdepth 1 -type f | sort

      - name: Run All Updaters
        run: |
          python3 .github/workflows/scripts/update-all.py

      - name: Show Git Changes
        run: |
          echo "=========================================="
          echo "Git Diff"
          echo "=========================================="

          git diff || true

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "cask: update"

      - name: Push Changes
        run: |
          git push