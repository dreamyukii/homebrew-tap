name: Update Prisma Access Browser

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 5"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Update Cask
        run: |
          python scripts/update-prisma-cask.py

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add .

          git diff --cached --quiet || \
          git commit -m "prisma-access-browser: update"

      - name: Push
        run: git push